<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Offline - SafeToilets</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #FFFFFF;
      color: #1C1917;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }
    .container {
      max-width: 320px;
      padding: 24px;
    }
    .wordmark {
      font-size: 24px;
      font-weight: 800;
      color: #16A34A;
      margin-bottom: 32px;
      letter-spacing: -0.5px;
    }
    .icon {
      width: 48px;
      height: 48px;
      color: #A8A29E;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 8px 0;
    }
    p {
      font-size: 13px;
      color: #78716C;
      margin: 0 0 32px 0;
      line-height: 1.5;
    }
    button {
      background-color: #16A34A;
      color: #FFFFFF;
      border: none;
      border-radius: 16px;
      height: 52px;
      width: 100%;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.2);
      transition: background-color 150ms;
    }
    button:active {
      background-color: #15803D;
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="wordmark">SafeToilets</div>
    
    <!-- inline wifi slash SVG -->
    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 3l18 18M10.5 8.5a5 5 0 017 0M7.05 5.05a10 10 0 0113.9 0M1.42 8.58a15 15 0 015.63-3.53m4.85 11.45L12 18l-1.9-1.5M10.1 13.9a2 2 0 012.8 0"></path>
    </svg>
    
    <h1>You're offline</h1>
    <p>SafeToilets needs a connection to find toilets nearby. Check your connection and try again.</p>
    
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
